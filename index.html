<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="main">
        <form class="form">
            <h1>Add User</h1>
            <h3>Name</h3>
            <input required type="text" placeholder="Name" id="userName">
            <h3>Role</h3>
            <input required type="text" placeholder="Role" id="role">
            <h3>Bio</h3>
            <textarea required name="bio" id="bio" placeholder="Bio"></textarea>
            <h3>User Photo URL</h3>
            <input required type="text" placeholder="User Photo URL" id="photo">
            <button>Submit</button>

        </form>

           <div class="content">
             <!--Users-->
            </div>
    </div>

 
    
    <script src="script.js"></script>
</body>
</html>
